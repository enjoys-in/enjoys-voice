<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC SIP Softphone</title>
    <!-- Load our local Browserify bundle of JsSIP -->
    <script src="/JsSIP.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-top: 0; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 14px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; color: white; }
        .btn-register { background-color: #007bff; }
        .btn-register:hover { background-color: #0056b3; }
        .btn-call { background-color: #28a745; }
        .btn-call:hover { background-color: #218838; }
        .btn-hangup { background-color: #dc3545; display: none; }
        .btn-hangup:hover { background-color: #c82333; }
        .status { text-align: center; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 6px; background-color: #e9ecef; color: #495057; }
        .status.registered { background-color: #d4edda; color: #155724; }
        .status.error { background-color: #f8d7da; color: #721c24; }
        .call-section { display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>WebRTC SIP Client</h2>
    
    <!-- Audio element to play incoming audio -->
    <audio id="remoteAudio" autoplay></audio>

    <div id="register-section">
        <div class="form-group">
            <label>WebSocket URI</label>
            <input type="text" id="ws_uri" value="ws://localhost:5066" placeholder="ws://localhost:5066">
        </div>
        <div class="form-group">
            <label>SIP URI (Extension)</label>
            <input type="text" id="sip_uri" value="sip:1000@localhost" placeholder="sip:1000@localhost">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="sip_password" value="3cQ4DVCoSJI_" placeholder="3cQ4DVCoSJI_">
        </div>
        <button class="btn-register" id="btn_register" onclick="connect()">Connect & Register</button>
    </div>

    <div id="status" class="status">Disconnected</div>

    <div id="call-section" class="call-section">
        <div class="form-group">
            <label>Dial Target (e.g. 9999 for AI, or 1001 for user)</label>
            <input type="text" id="target_uri" value="9999" placeholder="9999 or sip:1001@localhost">
        </div>
        <button class="btn-call" id="btn_call" onclick="makeCall()">Make Call</button>
        <button class="btn-hangup" id="btn_hangup" onclick="hangup()">Hang Up</button>
    </div>
</div>

<script>
    let ua = null;
    let currentSession = null;

    // RTCPeerConnection config. In JsSIP this MUST be passed as `pcConfig` in the
    // call/answer options — NOT as `rtcConfiguration` on the UA (that is ignored,
    // which is why ICE servers never applied and only host candidates appeared).
    // Relay ALL media through coturn: FreeSWITCH in Docker can't advertise a
    // browser-reachable ICE candidate, so the browser uses its TURN relay (which
    // FS reaches on the Docker bridge). 'relay' = don't even try host/srflx.
    //
    // TURN host is derived from the page's own hostname so it always matches the
    // machine serving the softphone (localhost, or a LAN IP like 192.168.1.55).
    // A hard-coded IP goes stale the moment the host joins a different network —
    // then relay-only ICE finds no candidates and the call silently fails with no
    // media, no ESL socket, and no recording.
    //
    // BOTH udp AND tcp relay transports are offered on purpose. On Docker Desktop
    // (Windows/macOS) published UDP ports are forwarded unreliably — the browser's
    // UDP TURN Allocate often never reaches coturn, so no relay candidate is
    // gathered and the call fails with 488 (no a=candidate in the SDP). Published
    // TCP ports ARE forwarded reliably, so the tcp relay is the dependable path
    // here; speedUpIce() sends the INVITE as soon as EITHER transport yields a
    // candidate, so we get UDP speed when it works and TCP reliability when it
    // doesn't.
    const TURN_HOST = window.location.hostname || 'localhost';
    const PC_CONFIG = {
        iceServers: [
            { urls: `turn:${TURN_HOST}:3478?transport=udp`, username: 'turnuser', credential: 'turnpass' },
            { urls: `turn:${TURN_HOST}:3478?transport=tcp`, username: 'turnuser', credential: 'turnpass' }
        ],
        iceTransportPolicy: 'relay'
    };

    function connect() {
        const wsUri = document.getElementById('ws_uri').value;
        const sipUri = document.getElementById('sip_uri').value;
        const password = document.getElementById('sip_password').value;

        const socket = new JsSIP.WebSocketInterface(wsUri);
        const configuration = {
            sockets: [ socket ],
            uri: sipUri,
            password: password,
            register: true, // Need to register to receive calls
            session_timers: false // Disable session timers which can cause 422 errors
        };

        ua = new JsSIP.UA(configuration);

        ua.on('connected', function(e){
            updateStatus('Connected to WebSocket', 'status');
            document.getElementById('call-section').style.display = 'block';
            document.getElementById('btn_register').style.display = 'none';
        });

        ua.on('disconnected', function(e){
            updateStatus('Disconnected', 'error');
            document.getElementById('call-section').style.display = 'none';
            document.getElementById('btn_register').style.display = 'block';
        });

        ua.on('registered', function(e){
            updateStatus('Registered Successfully', 'registered');
            document.getElementById('call-section').style.display = 'block';
            document.getElementById('btn_register').style.display = 'none';
        });

        ua.on('registrationFailed', function(e){
            updateStatus('Registration Failed', 'error');
        });

        // Handle incoming calls
        ua.on('newRTCSession', function(e) {
            const session = e.session;
            if (session.direction === 'incoming') {
                if (confirm(`Incoming call from ${session.remote_identity.uri.toString()}. Answer?`)) {
                    session.answer({
                        mediaConstraints: { audio: true, video: false },
                        pcConfig: PC_CONFIG
                    });
                } else {
                    session.terminate();
                }
            }
            
            currentSession = session;
            setupSessionListeners(session);
        });

        ua.start();
        updateStatus('Connecting...', 'status');
    }

    function makeCall() {
        let target = document.getElementById('target_uri').value;
        if (!target.includes('@')) {
            // Auto-append domain if they just typed the extension
            const domain = document.getElementById('sip_uri').value.split('@')[1];
            target = `sip:${target}@${domain}`;
        }

        const options = {
            mediaConstraints: { audio: true, video: false },
            pcConfig: PC_CONFIG
        };

        currentSession = ua.call(target, options);
        setupSessionListeners(currentSession);
    }

    function hangup() {
        if (currentSession) {
            currentSession.terminate();
        }
    }

    // Start playback at most once per stream. Calling play() repeatedly while a
    // previous play() promise is still pending throws a (harmless) AbortError —
    // this guard keeps the console clean and playback deterministic.
    function safePlay(el) {
        if (el.__playPending || !el.paused) return;
        el.__playPending = true;
        el.play().catch(err => {
            if (err && err.name !== 'AbortError') console.error('Audio playback error:', err);
        }).finally(() => { el.__playPending = false; });
    }

    // JsSIP (non-trickle) will not send the INVITE until the browser reports ICE
    // gathering 'complete'. In this Docker/TURN-relay setup, relay gathering is
    // slow and sometimes never completes, so the INVITE is never emitted (only
    // REGISTER appears on the wire) and the call dies silently. This forces the
    // issue: as soon as the first ICE candidate exists (in relay-only mode that
    // is the coturn relay candidate, already written into the local SDP) we allow
    // a short grace for extras, then synthesize the end-of-candidates signal so
    // JsSIP proceeds.
    //
    // IMPORTANT: never proceed before a candidate exists — an offer with no
    // a=candidate line makes FreeSWITCH answer 488 (INCOMPATIBLE_DESTINATION).
    // The long fallback only trips if TURN is truly dead, so the UI can surface a
    // real failure instead of hanging forever.
    function speedUpIce(pc) {
        if (pc.__iceSpeeded) return;
        pc.__iceSpeeded = true;
        let sent = false;
        const proceed = () => {
            if (sent) return;
            sent = true;
            try { pc.dispatchEvent(new RTCPeerConnectionIceEvent('icecandidate', { candidate: null })); }
            catch (e) { /* old browsers: fall back to native gathering completion */ }
        };
        pc.addEventListener('icecandidate', function (e) {
            if (e.candidate && !sent) setTimeout(proceed, 400);
        });
        pc.addEventListener('icegatheringstatechange', function () {
            if (pc.iceGatheringState === 'complete') { sent = true; }
        });
        setTimeout(proceed, 10000);
    }

    function attachRemoteAudio(pc) {
        const remoteAudio = document.getElementById('remoteAudio');
        pc.addEventListener('track', function(ev) {
            console.log('[RTC] remote track received', ev.track.kind);
            const newStream = (ev.streams && ev.streams[0]) ? ev.streams[0] : null;
            if (newStream) {
                if (remoteAudio.srcObject !== newStream) remoteAudio.srcObject = newStream;
            } else {
                // Some stacks fire track without streams[] — build one.
                let s = remoteAudio.srcObject;
                if (!s) { s = new MediaStream(); remoteAudio.srcObject = s; }
                if (!s.getTracks().includes(ev.track)) s.addTrack(ev.track);
            }
            safePlay(remoteAudio);
        });
    }

    function setupSessionListeners(session) {
        document.getElementById('btn_call').style.display = 'none';
        document.getElementById('btn_hangup').style.display = 'block';

        // Attach the remote-audio handler the MOMENT the peer connection exists —
        // the 'track' event usually fires BEFORE 'confirmed', so attaching it in
        // 'confirmed' (as before) missed the stream and produced silence.
        session.on('peerconnection', function(e) {
            speedUpIce(e.peerconnection);
            attachRemoteAudio(e.peerconnection);
        });
        // Fallback: if the PC already exists by the time we get here.
        if (session.connection) {
            speedUpIce(session.connection);
            attachRemoteAudio(session.connection);
        }

        session.on('progress', function(e) { updateStatus('Call in progress...', 'status'); });
        session.on('failed', function(e) {
            updateStatus('Call failed', 'error');
            resetCallUI();
        });
        session.on('ended', function(e) {
            updateStatus('Call ended', 'status');
            resetCallUI();
        });
        session.on('confirmed', function(e) {
            updateStatus('Call answered', 'registered');
            // Last-resort: ensure playback is (re)started once confirmed.
            safePlay(document.getElementById('remoteAudio'));
        });
    }

    function resetCallUI() {
        document.getElementById('btn_call').style.display = 'block';
        document.getElementById('btn_hangup').style.display = 'none';
        setTimeout(() => updateStatus('Registered Successfully', 'registered'), 3000);
    }

    function updateStatus(text, className) {
        const el = document.getElementById('status');
        el.innerText = text;
        el.className = 'status ' + className;
    }
</script>

</body>
</html>
