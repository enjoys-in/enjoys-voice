version: '3.8'
name: freeswitch-audiostream

services:
  freeswitch:
    build:
      context: .
      dockerfile: Dockerfile
    image: enjoys-freeswitch-audiostream:latest
    container_name: my-freeswitch-audiostream
    # Removed -nonat so FreeSWITCH will substitute external_rtp_ip (192.168.1.38)
    # into its ICE/SDP candidate instead of only advertising the unreachable
    # container IP. -nf = no console fork.
    command: ["/usr/local/freeswitch/bin/freeswitch", "-nf"]
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "5066:5066/tcp"   # WebRTC SIP WSS
      - "5080:5080/tcp"
      - "5080:5080/udp"
      - "7443:7443/tcp"
      - "8021:8021/tcp"   # ESL
      - "16384-16404:16384-16404/udp" # RTP Media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The image now carries its own FreeSWITCH config and sounds, so avoid
      # mounting the external freeswitch_configs tree that can override the build.
      - ./config/default_dialplan.xml:/usr/local/freeswitch/etc/freeswitch/dialplan/default/9999_test_ai.xml
      - ./config/tts_commandline.conf.xml:/usr/local/freeswitch/etc/freeswitch/autoload_configs/tts_commandline.conf.xml
      # Local WebRTC media fixes: advertise host LAN IP for RTP + pin the RTP port
      # range to the published docker range so browser<->FreeSWITCH audio flows.
      - ./config/vars.xml:/usr/local/freeswitch/etc/freeswitch/vars.xml
      - ./config/switch.conf.xml:/usr/local/freeswitch/etc/freeswitch/autoload_configs/switch.conf.xml
      # Accept LAN ICE candidates so WebRTC media negotiates (candidate-acl fix).
      - ./config/internal.xml:/usr/local/freeswitch/etc/freeswitch/sip_profiles/internal.xml
    restart: unless-stopped

  node-app:
    # TypeScript app compiled with SWC inside the image (Linux binaries). See
    # example-app/Dockerfile. public/ is mounted so UI edits and recordings live
    # on the host (recordings are reachable at http://localhost:3000/recording_*.wav).
    build:
      context: ./example-app
    image: enjoys-audiostream-app:latest
    container_name: my-freeswitch-node-app
    environment:
      - HTTP_PORT=3000
      - WS_PORT=8080
      - ESL_PORT=8085
      - WS_HOST_FOR_FS=node-app
      - AUDIO_CHANNELS=mono
      - AUDIO_SAMPLE_RATE=8000
      - AUDIO_SWAP_ENDIANNESS=false
      - RECORDING_ENABLED=true
      - RECORDING_DIR=public
      - TTS_VOICE=en_US-amy-medium
    volumes:
      - ./example-app/public:/app/public
    ports:
      - "3000:3000"
      - "8080:8080"
      - "8085:8085"
    depends_on:
      - freeswitch
    restart: unless-stopped

  # TURN server that bridges the browser (behind Docker Desktop's NAT) and
  # FreeSWITCH (on the Docker bridge). The browser relays ALL media through
  # coturn; coturn advertises its relay on its Docker IP (172.28.0.10), which
  # FreeSWITCH can reach directly on the bridge — and coturn can reach FS's
  # Docker-IP candidate directly too. Only 3478 needs publishing to the host.
  coturn:
    image: coturn/coturn:latest
    container_name: my-freeswitch-coturn
    command: >
      -n
      --log-file=stdout
      --listening-ip=0.0.0.0
      --listening-port=3478
      --relay-ip=172.28.0.10
      --external-ip=172.28.0.10
      --min-port=49152
      --max-port=49452
      --realm=localhost
      --lt-cred-mech
      --user=turnuser:turnpass
      --no-tls
      --no-dtls
      --verbose
    networks:
      default:
        ipv4_address: 172.28.0.10
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
