# Local-only compose: media stack + SIP engine, using HOST Postgres (:5432) and
# Valkey (:6379). Does NOT start its own DB/cache containers.
# Usage: docker compose -f docker-compose.local.yml up -d
name: voip-local

services:
  drachtio-server:
    image: drachtio/drachtio-server
    container_name: drachtio-server
    ports:
      - "127.0.0.1:9022:9022"
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5065:5065/tcp"
    environment:
      - DRACHTIO_SECRET=siprocks
      - DRACHTIO_LISTEN=tcp,udp
      - DRACHTIO_PORT=9022
      - DRACHTIO_EXTERNAL_IP=auto
    volumes:
      - ./drachtio-server/config/drachtio.conf.xml:/etc/drachtio.conf.xml
    networks:
      - voipnet
    restart: unless-stopped

  drachtio-freeswitch:
    image: mullayam06/freeswitch-audiostream-piper:latest
    container_name: drachtio-freeswitch
    ports:
      - "8021:8021"
      - "5090:5090/udp"
      - "5090:5090/tcp"
      - "16384-16403:16384-16403/udp"
    cap_add:
      - SYS_NICE
    environment:
      - SOUND_RATES=8000:16000
      - SOUND_TYPES=music:en-us-callie
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # audiostream image uses /usr/local/freeswitch/etc/freeswitch (built from source)
      - ./freeswitch_configs:/usr/local/freeswitch/etc/freeswitch
      - ./freeswitch_sounds:/usr/share/freeswitch/sounds
      - ./recordings:/usr/local/freeswitch/recordings
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -p 'JambonzR0ck$$' -x status | grep -q 'is ready'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - voipnet
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    container_name: callnet-coturn
    command: ["-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49252-49292:49252-49292/udp"
    volumes:
      - ./coturn/turnserver.dev.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - voipnet
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: callnet-api
    ports:
      - "3001:3001"
      - "3002:3002"
      - "3004:3004"
      - "3005:3005"
    environment:
      HTTP_PORT: "3001"
      WS_PORT: "3002"
      MEDIA_STREAM_WS_PORT: "3004"
      MEDIA_STREAM_BRIDGE_PORT: "3005"
      # Point at the HOST's Postgres and Valkey (standard ports)
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5432/postgres?sslmode=disable
      VALKEY_ADDR: host.docker.internal:6379
      VALKEY_PASSWORD: ""
      VALKEY_DB: "0"
      # Must match the Go API's default so tokens are interchangeable
      JWT_SECRET: enjoys-voice-secret-change-me
      DOMAIN: localhost
      PUBLIC_SIP_WS_URL: "ws://localhost:5065"
      PUBLIC_WS_URL: "ws://localhost:3002/signal"
      ALLOWED_ORIGINS: "http://localhost:4500,http://localhost:3000"
      DRACHTIO_HOST: drachtio-server
      DRACHTIO_PORT: "9022"
      DRACHTIO_SECRET: siprocks
      FREESWITCH_HOST: drachtio-freeswitch
      FREESWITCH_PORT: "8021"
      FREESWITCH_LISTEN_ADDRESS: callnet-api
      FREESWITCH_LISTEN_PORT: "8085"
      FS_AUDIO_STREAM_ENABLED: "true"
      MEDIA_STREAM_ENABLED: "true"
      FS_STT_PROVIDER: deepgram
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      RECORDINGS_DIR: /app/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - callnet-recordings:/app/recordings
    networks:
      - voipnet
    restart: unless-stopped

networks:
  voipnet:
    driver: bridge

volumes:
  callnet-recordings:
